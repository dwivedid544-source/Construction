version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiaan_postgres
    restart: always
    environment:
      POSTGRES_DB: kiaan_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Dhruv@23#11dwivedi!2004
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kiaan_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiaan_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:Dhruv%4023%2311dwivedi%212004@postgres:5432/kiaan_erp
      DB_DRIVER: prisma
      JWT_SECRET: kaal_construction_management_secret_key_2026
    ports:
      - "4000:4000"

  nginx:
    image: nginx:alpine
    container_name: kiaan_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/var/www/uploads:ro

volumes:
  postgres_data:
